<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>San Marino Multimarcas • Texto Contratual</title>

  <style>
    :root{
      --bg:#f4f5f8;
      --card:#ffffff;
      --stroke:rgba(20,30,50,.12);
      --text:#0e1625;
      --muted:#5f6b7a;
      --gold:#c9a33b;
      --gold-soft:rgba(201,163,59,.14);
      --shadow:0 24px 50px rgba(14,22,37,.12);
      --radius:30px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(800px 420px at 50% 0%, rgba(201,163,59,.18), transparent 60%),
        linear-gradient(180deg, #eef0f4, #f7f8fb);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 24px;
    }

    .app{
      width:100%;
      max-width:980px;
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:34px 36px 32px;
    }

    /* LOGO PREMIUM CENTRAL */
    .logo-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:18px;
    }

    .logo-premium{
      padding:14px 28px;
      border-radius:999px;
      border:1px solid rgba(201,163,59,.35);
      background:
        linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.7));
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.6),
        0 10px 26px rgba(201,163,59,.18);
    }

    .logo-premium img{
      height:36px;
      display:block;
    }

    header{
      text-align:center;
      margin-bottom:26px;
    }

    header h1{
      margin:0;
      font-size:19px;
      font-weight:700;
      letter-spacing:.2px;
    }

    header p{
      margin:6px 0 0;
      font-size:13.5px;
      color:var(--muted);
    }

    /* ABAS PREMIUM */
    .tabs{
      display:flex;
      gap:14px;
      margin-bottom:20px;
    }

    .tab{
      flex:1;
      padding:16px 22px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:#f7f8fb;
      font-weight:700;
      font-size:13.5px;
      color:var(--text);
      cursor:pointer;
      transition:.18s ease;
      text-align:center;
    }

    .tab:hover{
      transform:translateY(-1px);
    }

    .tab.active{
      background:var(--gold-soft);
      border-color:var(--gold);
      box-shadow:0 0 0 4px rgba(201,163,59,.12);
    }

    /* TEXTO COM CARA DE CONTRATO */
    textarea{
      width:100%;
      min-height:340px;
      border-radius:22px;
      border:1px solid var(--stroke);
      background:#ffffff;
      padding:22px;
      font-family: "Times New Roman", Georgia, serif;
      font-size:14.5px;
      line-height:1.7;
      color:#111827;
      resize:vertical;
      outline:none;
    }

    textarea:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 4px rgba(201,163,59,.12);
    }

    /* BOTÃO PREMIUM */
    .actions{
      display:flex;
      justify-content:flex-end;
      margin-top:22px;
    }

    .btn{
      padding:14px 26px;
      border-radius:14px;
      border:1px solid var(--gold);
      background:
        linear-gradient(180deg, rgba(201,163,59,.35), rgba(201,163,59,.18));
      color:#3a2c00;
      font-weight:800;
      font-size:13.5px;
      cursor:pointer;
      transition:.15s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 6px 18px rgba(201,163,59,.28);
    }

  </style>
</head>

<body>
  <div class="app">

    <!-- LOGO PREMIUM -->
    <div class="logo-wrap">
      <div class="logo-premium">
        <img src="SM_MULTIMARCAS_preto.png" alt="San Marino Multimarcas">
      </div>
    </div>

    <header>
      <h1>Texto a ser inserido no contrato conforme modalidade de venda</h1>
      <p>Selecione a modalidade e copie o texto correspondente</p>
    </header>

    <!-- GARANTIA EM DOBRO À ESQUERDA / OUTLET À DIREITA -->
    <div class="tabs">
      <button class="tab active" id="tabTradicional">
        Modalidade de venda tradicional com GARANTIA EM DOBRO
      </button>
      <button class="tab" id="tabOutlet">
        Modalidade de venda Outlet
      </button>
    </div>

    <textarea id="texto"></textarea>

    <div class="actions">
      <button class="btn" id="copiar">Copiar texto</button>
    </div>

  </div>

<script>
const outlet = `Declaro estar ciente de que o veículo adquirido se encontra enquadrado na Modalidade de Venda OUTLET, a qual se caracteriza por condições comerciais diferenciadas com o veículo podendo incluir características estéticas visíveis nas peças de lataria e pneus, desgaste natural compatível com o tempo de uso e demais particularidades previamente informadas e disponíveis para vistoria.

Em razão da natureza desta modalidade de venda OUTLET, declaro estar ciente que a garantia aplicável ao veículo objeto deste contrato será restrita única e exclusivamente aos componentes de MOTOR e CAIXA DE CÂMBIO, pelo prazo legal de 90 (noventa) dias, conforme previsto no artigo 26, inciso II, do Código de Defesa do Consumidor.

Declaro estar ciente que nenhuma outra garantia está inclusa, sendo excluída qualquer cobertura relativa a itens de desgaste natural, peças elétricas, eletrônicas, suspensão, freios, lataria, pintura, sistemas de entretenimento, acessórios, vibrações, avarias decorrentes de uso inadequado ou qualquer outro componente que não seja relacionado a motor e caixa de câmbio.

Declaro que tive oportunidade de vistoriar o veículo antes da compra e que concordo com as condições descritas acima referente a modalidade de venda OUTLET.`;

const tradicional = `O Código de Defesa do Consumidor, em seu artigo 26, inciso II, estabelece que o consumidor tem direito a 90 dias de garantia na compra de um veículo seminovo. A San Marino, por meio da campanha GARANTIA EM DOBRO, oferece a você, nosso cliente, 90 dias adicionais, totalizando 180 dias de garantia para o veículo objeto deste contrato. Esta garantia estendida, dos dias 91 até o dia 180, abrange exclusivamente defeitos no motor e na caixa de câmbio.`;

const textarea = document.getElementById("texto");
const tabTradicional = document.getElementById("tabTradicional");
const tabOutlet = document.getElementById("tabOutlet");

textarea.value = tradicional;

tabTradicional.onclick = () => {
  tabTradicional.classList.add("active");
  tabOutlet.classList.remove("active");
  textarea.value = tradicional;
};

tabOutlet.onclick = () => {
  tabOutlet.classList.add("active");
  tabTradicional.classList.remove("active");
  textarea.value = outlet;
};

document.getElementById("copiar").onclick = async () => {
  await navigator.clipboard.writeText(textarea.value);
};
</script>
</body>
</html>
